#spring.application.name=flashcard-engine

spring.application.name=flashcard-engine

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_KEY}
jwt.expiration=86400000

# Claude API
#claude.api.key=your_anthropic_api_key_here
#claude.api.url=https://api.anthropic.com/v1/messages
#claude.model=claude-sonnet-4-20250514


# Gemini API
gemini.api.key=${API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#logging.level.org.springframework.security=DEBUG

spring.web.cors.allowed-origins=http://localhost:5173